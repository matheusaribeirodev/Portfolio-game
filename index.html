  <div id="app">
    <canvas id="game" tabindex="-1" aria-label="Mundo 2D do portfólio. Use o mapa (tecla M) ou o portfólio tradicional para acessar o conteúdo sem jogar."></canvas>

    <!-- ===================== MENU INICIAL ===================== -->
    <section id="menu" class="screen" aria-labelledby="menu-title">
      <canvas id="menu-bg" aria-hidden="true"></canvas>
      <div class="menu-content">
        <p class="menu-kicker"><span>Developer Portfolio</span></p>
        <h1 id="menu-title">Matheus<br>Augusto Ribeiro</h1>
        <p class="menu-role">Desenvolvedor Full Stack &amp; UI Designer</p>
        <nav class="menu-buttons" aria-label="Menu inicial">
          <button id="btn-start" class="pbtn pbtn-primary"><span>▶ INICIAR JOGO</span><small id="start-sub"></small></button>
          <button id="btn-controls" class="pbtn"><span>CONTROLES</span></button>
          <button id="btn-classic" class="pbtn"><span>PORTFÓLIO TRADICIONAL</span></button>
        </nav>
        <p class="menu-foot">Cajamar · SP &nbsp;•&nbsp; Áudio opcional &nbsp;•&nbsp; Progresso salvo no navegador</p>
      </div>
    </section>

    <!-- ===================== HUD ===================== -->
    <div id="hud" hidden>
      <div class="hud-card">
        <canvas id="hud-avatar" width="18" height="26" aria-hidden="true"></canvas>
        <div class="hud-info">
          <strong id="hud-name">MATHEUS</strong>
          <span id="hud-role"></span>
          <div id="progress-bar" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progresso de exploração">
            <span id="progress-fill"></span>
          </div>
          <span id="progress-label" class="hud-small">Exploração 0%</span>
          <div id="area-pips" aria-label="Áreas exploradas"></div>
        </div>
      </div>
      <div id="hud-actions" class="hud-actions"></div>
      <button id="minimap-btn" class="minimap" aria-label="Abrir mapa e navegação (M)"><canvas id="minimap" aria-hidden="true"></canvas><span>MAPA · M</span></button>
      <div id="quest-tracker" class="quest-tracker" aria-live="polite"></div>
      <div id="prompt" class="prompt" aria-live="polite"></div>
      <div id="hint" class="hint"></div>
    </div>
    <div id="zone-banner" class="zone-banner" aria-live="polite"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- ===================== DIÁLOGO RPG ===================== -->
    <div id="dialog" class="dialog" hidden role="dialog" aria-live="polite" aria-label="Diálogo">
      <canvas class="portrait" width="48" height="48" aria-hidden="true"></canvas>
      <div class="dlg-body">
        <p class="dlg-name"></p>
        <p class="dlg-text"></p>
      </div>
      <span class="dlg-next" aria-hidden="true">▼</span>
      <span class="dlg-help">E · Enter · toque para continuar</span>
    </div>

    <!-- ===================== JANELA (MODAL) ===================== -->
    <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-window">
        <header class="modal-head">
          <button class="modal-back" aria-label="Voltar" hidden>←</button>
          <span class="modal-badge"></span>
          <h2 id="modal-title"></h2>
          <button class="modal-close" aria-label="Fechar (ESC)">✕</button>
        </header>
        <div class="modal-body"></div>
      </div>
    </div>

    <!-- ===================== CONTROLES DE TOQUE ===================== -->
    <div id="touch" class="touch" hidden>
      <div id="joy-base" class="joy-base" aria-label="Joystick virtual"><div id="joy-knob" class="joy-knob"></div></div>
      <button id="touch-pause" class="touch-btn small" aria-label="Pausa">II</button>
      <button id="touch-e" class="touch-btn" aria-label="Interagir">E</button>
    </div>

    <div id="fade" class="fade" aria-hidden="true"></div>
  </div>

  <!-- ===================== PORTFÓLIO TRADICIONAL ===================== -->
  <main id="classic" class="classic" hidden></main>
